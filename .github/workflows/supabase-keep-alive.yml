name: Keep Everything Alive

on:
  schedule:
    - cron: '0 0 */3 * *' # 3일마다 실행
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 신청 기록 정리에 쓴다. 시크릿이 없으면 해당 단계를 건너뛴다.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      # 1. Supabase 깨우기 (오류 발생 시 Action 실패하도록 -f 옵션 추가)
      - name: Ping Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase API..."
          curl -f -s -X GET "$SB_URL/rest/v1/posts?select=*&limit=1" \
          -H "apikey: $SB_KEY" \
          -H "Authorization: Bearer $SB_KEY"
          echo "Ping successful!"

      # 2. 레포지토리 체크아웃
      - name: Checkout repo
        uses: actions/checkout@v4

      # 3. 보유 기간이 지난 신청 기록 삭제
      #
      # 학생 신청 폼에 "활동 종료 후 30일 이내 삭제" 라고 고지했다. 이 단계가 그
      # 약속을 지킨다. 조건과 기간은 script/cleanup.ts 에 있다.
      #
      # DATABASE_URL 시크릿이 없으면 이 단계는 건너뛴다. Supabase 깨우기가
      # 정리 실패 때문에 같이 멈추면 프로젝트가 일시정지되므로, 여기서 죽이지 않는다.
      # (건너뛰면 로그에 남으니 시크릿 누락은 눈에 띈다.)
      # secrets 컨텍스트는 스텝의 if 에서 쓸 수 없다. 잡 레벨 env 로 옮겨 두고
      # env 를 본다 (env 는 if 에서 쓸 수 있다).
      - name: Setup Node
        if: env.DATABASE_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Delete expired applications
        if: env.DATABASE_URL != ''
        continue-on-error: true
        run: |
          npm ci
          npx tsx script/cleanup.ts

      # 4. 빈 커밋으로 GitHub Action 일시정지 방지
      - name: Git Keep-alive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: Keep-alive commit $(date +'%Y-%m-%d')"
          git push
